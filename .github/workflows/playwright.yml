name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # One parallel job per browser — generated from this matrix.
    strategy:
      fail-fast: false          # one browser failing does NOT cancel the others
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: web-api   # project lives in the web-api/ subfolder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}   # only this browser

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          API_USER: ${{ secrets.API_USER }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
          WEB_USER: ${{ secrets.WEB_USER }}
          WEB_PASSWORD: ${{ secrets.WEB_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}   # unique per job — no collision
          path: web-api/playwright-report/
          retention-days: 30
